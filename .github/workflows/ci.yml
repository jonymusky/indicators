name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/Indicators.app build/Indicators.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Indicators.app
          path: build/Indicators.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Indicators.app
      - uses: softprops/action-gh-release@v2
        with:
          files: Indicators.zip
          generate_release_notes: true
